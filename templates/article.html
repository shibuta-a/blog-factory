<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | {{site_name}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="article">
{{og_image}}
<link rel="stylesheet" href="{{root}}assets/style.css">
<!-- HEAD_SLOT: 広告ネットワークの<head>用スクリプト（AdSense等）はここに入れる -->
{{slot_head}}
</head>
<body>
<header class="site-header">
  <a class="site-name" href="{{root}}{{lang_path}}">{{site_name}}</a>
  {{featured_nav}}
</header>

<main class="container">
  <article>
    <h1 class="article-title">{{title}}</h1>
    <p class="meta"><time datetime="{{date}}">{{date_label}} {{date}}</time>{{updated}}</p>
    {{pr_notice}}
    {{eyecatch}}

    <!-- AD_SLOT_TOP -->
    {{slot_ad_top}}

    <nav class="toc" aria-label="{{toc_label}}">
      <p class="toc-title">{{toc_label}}</p>
      {{toc}}
    </nav>

    <!-- CTA_TOP: 目次の下の申込みボックス（scripts/affiliate.py が自動で入れる） -->
    {{cta_top}}

    <div class="article-body">
      {{body}}
    </div>

    <!-- FEATURED: 自社サービスへの誘導（広告より先に出す） -->
    {{featured_box}}

    <!-- AFFILIATE_SLOT -->
    {{slot_affiliate}}

    {{photo_credit}}
  </article>

  <p class="back"><a href="{{root}}{{lang_path}}">← {{back_label}}</a></p>
</main>

<footer class="site-footer">
  <p>&copy; {{year}} {{site_name}}</p>
</footer>
</body>
</html>
