# X（@maf_media_jp）の投稿係（scripts/xpost.py deploy が設定・デプロイする）
name = "maf-x-poster"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "POSTED"
id = "28ba2e9e3f91417ca57003c7a262647c"

# 投稿の結果を見張り番（workers/guard）へ
[[services]]
binding = "GUARD_SVC"
service = "maf-guard"
