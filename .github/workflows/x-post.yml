# X（@maf_media_jp）の投稿係。30分おきに data/x-queue/<今日>.json を見て、時刻が来た投稿を X API で出す（scripts/x-actions.py）。
# PC が切れていても動く。キーはリポジトリの Secrets（X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_SECRET）。
# 定期実行（cron）は GitHub の都合で遅れたり動かなかったりするため、1回の実行が「今日の次の投稿の時刻まで待って出す」を続け、
# 5時間半で区切って自分をもう一度起動して引き継ぐ（待ち番）。朝の x-plan.py も予定表を送ったあとに1回起動する。cron は待ち番が切れたときの保険。
# 手で動かすとき（通し確認）: Actions → x-post → Run workflow（dry_run=true なら API に送る直前で止める）
name: x-post

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら投稿しない（認証の確認まで）"
        default: "true"
      now:
        description: "日本時間の現在時刻として扱う時刻（例 2026-10-17T23:59・空なら今）"
        default: ""
      queue:
        description: "予定表のファイル（空なら data/x-queue/<今日>.json）"
        default: ""

permissions:
  contents: write
  actions: write   # 待ち番の引き継ぎ（自分自身をもう一度起動する）

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: 時刻が来た投稿を出す
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false' }}
          NOW: ${{ inputs.now }}
          GH_TOKEN: ${{ github.token }}
          QUEUE: ${{ inputs.queue }}
        run: |
          args="--loop"
          [ "$DRY" = "true" ] && args="--dry-run"
          [ -n "$NOW" ] && args="$args --now $NOW"
          [ -n "$QUEUE" ] && args="$args --queue $QUEUE"
          python3 scripts/x-actions.py $args
      - name: 記録を GitHub に残す
        if: always()
        run: bash scripts/x-record.sh
